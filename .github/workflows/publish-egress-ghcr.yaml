# Fork-specific workflow (ifc-narita/egress).
#
# Builds the patched egress image on GitHub-hosted runners and publishes it to
# GHCR, so that machines with limited disk space only need to pull the final
# runtime image instead of building it locally (the build requires the
# multi-GB livekit/gstreamer dev image).
#
# Published image: ghcr.io/ifc-narita/egress:v1.13.0-ws-leak-fix

name: Publish Egress (GHCR)

on:
  workflow_dispatch:
  push:
    branches:
      - fix/websocket-sink-memory-leak

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The egress build needs ~10GB of scratch space; GitHub-hosted runners
      # ship with large preinstalled toolchains we don't need.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.11

      - name: Download Go modules
        run: go mod download

      - name: Get template image
        id: template-tag
        run: |
          TEMPLATE_TAG=`go run github.com/livekit/egress/cmd/template_version`
          echo "template_tag=$TEMPLATE_TAG" > "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./build/egress/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:v1.13.0-ws-leak-fix
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: |
            TEMPLATE_TAG=${{ steps.template-tag.outputs.template_tag }}
